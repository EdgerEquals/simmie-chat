<!doctype html>
<!-- HELD-WORK PREVIEW of the chat page: source simmie-chat branch chat-dashfunc 4cd618d (f68cd08 + 4cd618d on 4a9a83a), copied into previews/chat-held/.
     Sample messages only: no password gate, no keys, no relay, no network sends. The live chat page is not touched. -->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F8CFDB">
<title>PREVIEW (held work) · Chat with Simmie</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Gochi+Hand&family=Kaushan+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dad-palette.css?v=1">
<link rel="stylesheet" href="css/chat.css?v=5">
<link rel="stylesheet" href="css/chat-dashlayout.css?v=3">
<link rel="stylesheet" href="dash/css/dash-shared.css?v=1">
<link rel="stylesheet" href="dash/css/chat-dash.css?v=1">
<link rel="stylesheet" href="dash/css/tide-swell.css?v=1">
<link rel="stylesheet" href="css/preview.css?v=1">
<script src="dash/js/phi-timing.js?v=1"></script>
</head>
<body>
<!-- static background (texture only, chat page colours; nothing moves): css/chat-dashlayout.css -->
<div class="chat-bg" aria-hidden="true"><div class="chat-bg-dots"></div><div class="chat-bg-code"></div></div>
<main id="app">

  <section id="screen-chat" class="screen chat">
    <!-- HELD-WORK PREVIEW band (previews/chat-held/): sample chat only, no password gate, nothing is sent -->
    <div class="preview-band" role="note">PREVIEW — sample chat · made-up messages · nothing is sent</div>
    <!-- SHARED HEADER (Danny's shared-header rule, 03:13 AWST 24 Oct): Bonnie's Dashboard header (rebella 64371b8), chat-page colours
         (dash/css/dash-shared.css, generated by tools/sync_dash_header.py) and chat scope (no age dial). -->
  <div class="dash-head" id="dash-head">
  <div class="topbar"><div class="container">
    <!-- logo slot (shared header): Bonnie's logo, tinted with the chat page's raspberry #B4436C (not a link) -->
    <svg class="tb-logo tb-logo-svg" viewBox="413 534 1810 893" role="img" aria-label="Rebella"><use href="img/bonnies-logo.svg#bonnies-logo"/></svg>
    <span class="tb-right"><button id="lock-btn" class="lockbtn" type="button" title="Lock this chat" aria-label="Lock this chat">&#128274; Lock</button>
    <!-- Ask Dad: amber circle pinned top-right of the header, Lock just to its left -->
    <button id="ask-dad" class="ask-dad" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="dad-panel" aria-label="Ask Dad"><span class="ad-orbit" aria-hidden="true"><span class="ad-sat">🛰️</span></span><span class="ad-w" aria-hidden="true">Ask</span><span class="ad-w" aria-hidden="true">Dad</span></button></span>
  </div></div>
  <!-- weather chip + age-linked fun-fact ticker -->
  <div class="wx-hud"><div id="il-head" class="il-lane il-head" aria-hidden="true"></div><div class="container">
    <div id="wx-ticker" class="wx-ticker" role="marquee" aria-label="Fun facts"><div id="wx-tick-track" class="wx-tick-track"></div></div>
    <span id="wx-seq" class="wx-seq" aria-hidden="true"></span><span id="wx-chip" class="wx-chip" role="img" hidden><span class="wx-text"></span></span>
  </div></div>
  <header class="masthead"><div class="container">
    <div class="brand">
      <img class="dad-mark" src="dash/img/dad-mark.svg?v=2" width="32" height="32" alt="" title="Dad's world mark">
      <!-- tagline: the chat page's own sub-line, in the header's bottom row beside Dad's mark (shared header) -->
      <span id="status" class="tagline mh-tagline">Replies usually take under a minute</span>
    </div>
  </div></header>
  </div><!-- /dash-head -->
    <div id="log" class="log" aria-live="polite" aria-label="Messages"></div>
    <!-- SHARED FOOTER: the dashboard's locked footer stack (animal lane, #app-foot line, Simmie terminal + strip + emoji ticker)
         with this page's message box + Send kept in it; locked at the bottom, only the messages scroll. -->
    <div id="chat-foot" class="chat-foot">
      <div id="typing" class="typing" hidden><span class="dots"><i></i><i></i><i></i></span> <span id="typing-text">Waiting for Simmie…</span></div>
  <div id="il-foot" class="il-lane il-foot" aria-hidden="true"></div>
      <footer class="footer" id="app-foot"><div class="container"><span>Preview: sample messages only, nothing you type is sent</span></div></footer>
      <form id="send-form" class="composer" autocomplete="off"><div class="container">
        <textarea id="msg" rows="1" maxlength="1500" placeholder="Type a message…" aria-label="Message"></textarea>
        <button id="send-btn" class="send" type="submit" aria-label="Send">➤</button>
      </div></form>
  <div id="wx-foot" class="wx-foot" role="region" aria-label="Simmie and status">
    <div id="tty" class="tty">
      <div class="tty-bar"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><span aria-hidden="true">simmie — tty</span><em id="tty-mlog" class="tty-mlog" aria-hidden="true"></em></div>
      <div class="tty-body">
        <span class="tty-cloudwrap"><span class="cl-orbit" aria-hidden="true"><span>🛰️</span></span><svg id="tty-cloud" class="tty-cloud" viewBox="0 0 196 172" aria-hidden="true" focusable="false"><defs><clipPath id="tty-cl"><circle cx="56.3" cy="116.7" r="45.4"/><circle cx="73.2" cy="73.7" r="60.7"/><circle cx="135.3" cy="86.8" r="51.3"/><circle cx="96.7" cy="105.1" r="56.2"/><circle cx="112.4" cy="53.7" r="43.1"/></clipPath><linearGradient id="tty-sh" x1="0" x2="1"><stop offset="0" stop-opacity="0" style="stop-color:var(--tc-80)"/><stop offset=".5" stop-opacity=".35" style="stop-color:var(--tc-80)"/><stop offset="1" stop-opacity="0" style="stop-color:var(--tc-80)"/></linearGradient></defs><g class="cl-body"><g style="fill:var(--tc-210)"><circle cx="56.3" cy="116.7" r="45.4"/><circle cx="73.2" cy="73.7" r="60.7"/><circle cx="135.3" cy="86.8" r="51.3"/><circle cx="96.7" cy="105.1" r="56.2"/><circle cx="112.4" cy="53.7" r="43.1"/></g><g clip-path="url(#tty-cl)"><rect class="cl-shine" x="-120" y="0" width="90" height="172" fill="url(#tty-sh)"/></g><g class="cl-eyes" style="fill:var(--tc-211)"><rect x="93.10" y="44.4" width="18" height="42" rx="9.0" transform="rotate(-27 102.1 65.4)"/><rect x="130.65" y="34.5" width="16.5" height="42" rx="8.25" transform="rotate(-27 138.9 55.5)"/></g></g></svg></span>
        <button id="tty-open" class="tty-line" type="button" aria-label="Simmie says hello. Tap to talk to Simmie"><span class="tty-p">simmie&gt;</span> <span id="tty-out" class="tty-out"></span><span class="tty-hint" aria-hidden="true">tap to talk to Simmie</span></button>
        <div id="tty-busy" class="tty-line tty-busy" hidden><span class="tty-p">simmie&gt;</span> <span id="tty-busy-text" class="tty-out"></span></div>
        <form id="tty-form" class="tty-form" hidden autocomplete="off">
          <label for="tty-in" id="tty-prompt" class="tty-p">simmie$</label>
          <span class="tty-inwrap"><input id="tty-in" class="tty-in" type="text" maxlength="1500" spellcheck="true" enterkeyhint="send"><span class="tty-cursor" aria-hidden="true"></span></span>
          <button id="tty-send" class="tty-send" type="submit">Send</button>
          <button id="tty-x" class="tty-x" type="button" aria-label="Close talk to Simmie">×</button>
        </form>
        <span id="tty-measure" class="tty-measure" aria-hidden="true">0000000000</span>
      </div>
      <p id="tty-live" class="sr-only" aria-live="polite"></p>
    </div>
    <!-- footer row: portrait = display:contents (layout unchanged); short landscape = one horizontally scrollable row above the full-width terminal -->
    <div id="ft-row" class="ft-row">
    <div id="wx-mlog" class="wx-mlog" role="log" aria-label="Mission log" aria-live="off"></div>
      <div class="wx-strip">
        <span class="wx-light idle" data-light="queue" role="img" aria-label="SENT"><b></b><small><span class="lg">SENT</span><span class="sm">S</span></small></span>
        <span class="wx-light idle" data-light="fresh" role="img" aria-label="FRESH"><b></b><small><span class="lg">FRESH</span><span class="sm">F</span></small></span>
        <span class="wx-light idle" data-light="link" role="img" aria-label="LINK"><b></b><small><span class="lg">LINK</span><span class="sm">L</span></small></span>
        <span class="wx-light idle" data-light="dad" role="img" aria-label="DAD"><b></b><small><span class="lg">DAD</span><span class="sm">D</span></small></span>
        <svg class="wx-wave" viewBox="0 0 80 16" aria-hidden="true"><path d="M0 8 Q5 2 10 8 T20 8 T30 8 T40 8 T50 8 T60 8 T70 8 T80 8 T90 8 T100 8 T110 8 T120 8 T130 8 T140 8 T150 8 T160 8"/></svg>
        <svg id="wx-gauge" class="wx-gauge" viewBox="0 0 32 18" role="img" aria-label="Answered"><path class="g-arc" d="M3 16 A13 13 0 0 1 29 16"/><line class="g-needle" x1="16" y1="16" x2="16" y2="5"/><circle cx="16" cy="16" r="1.8"/></svg>
      </div>
      <!-- no weather in the footer (Danny 03:15): the dashboard's weather readout and SKY light are left out here -->
      <div id="wx-marquee" class="wx-marquee" aria-hidden="true"><div id="wx-mq-track" class="wx-mq-track"></div></div>
      <!-- tide + swell (Danny 24 Oct 2026 03:43 AWST, HELD): today's tide off Fremantle + dolphins paced by the swell (dash/js/tide-swell.js; Open-Meteo Marine, CC BY 4.0) -->
      <span id="wx-tide" class="tsw" data-ts-key="simmie.chat.tide" hidden></span>
    </div>
  </div>
    </div>
  <template id="biplane-tpl"><svg class="biplane" viewBox="0 0 48 30" width="64" height="40" aria-hidden="true" focusable="false">
    <g stroke-width="1.2" stroke-linejoin="round" style="stroke:var(--tc-89)">
      <rect x="9" y="3" width="28" height="4" rx="2" style="fill:var(--tc-16)"/>
      <line x1="15" y1="7" x2="15" y2="17"/><line x1="31" y1="7" x2="31" y2="17"/><line x1="15" y1="7" x2="31" y2="17" stroke-width=".8"/>
      <path d="M2 12 L8 9 L9 15 Z" style="fill:var(--tc-5)"/><path d="M1 8 L5 8 L8 13 L4 13 Z" style="fill:var(--tc-16)"/>
      <path d="M6 13 Q22 8 38 11 Q41 14 38 17 Q22 19 6 15 Z" style="fill:var(--tc-88)"/>
      <rect x="9" y="16" width="28" height="4" rx="2" style="fill:var(--tc-16)"/>
      <circle cx="40" cy="14" r="2.6" style="fill:var(--tc-5)"/>
      <line x1="20" y1="20" x2="18" y2="25"/><line x1="26" y1="20" x2="28" y2="25"/><circle cx="18" cy="26" r="2" style="fill:var(--tc-21)"/><circle cx="28" cy="26" r="2" style="fill:var(--tc-21)"/>
      <circle cx="22" cy="12" r="1.6" stroke="none" style="fill:var(--tc-21)"/>
    </g>
    <g class="bp-prop"><rect x="42.2" y="6" width="1.6" height="16" rx=".8" opacity=".85" style="fill:var(--tc-92)"/></g>
  </svg></template>
  <!-- Ask Dad transmission window (allowed pop-up; Esc or the close key dismisses it). PREVIEW: sends nothing. -->
  <section id="dad-panel" class="dad-panel" role="dialog" aria-modal="false" aria-labelledby="dad-title" hidden>
    <div class="dp-head"><h2 id="dad-title" class="dp-title">transmit to Dad</h2><button id="dp-x" class="dp-x" type="button" aria-label="Close, don't send">×</button></div>
    <form id="dp-form" class="dp-form" autocomplete="off">
      <div class="dp-chips" role="group" aria-label="Quick messages">
        <button type="button" class="dp-chip">Can we talk?</button><button type="button" class="dp-chip">Can you check something on my page?</button><button type="button" class="dp-chip">Just saying hi</button>
      </div>
      <label for="dp-text" class="sr-only">Message to Dad</label>
      <textarea id="dp-text" class="dp-text" rows="2" maxlength="1200" placeholder="&gt; type to Dad…"></textarea>
      <div class="dp-foot"><span id="dp-status" class="dp-status" role="status" aria-live="polite"></span><button id="dp-send" class="dp-send" type="submit">Transmit</button></div>
    </form>
    <span class="dp-ripple" aria-hidden="true"></span><span class="dp-sat" aria-hidden="true">🛰️</span>
  </section>
  </section>

</main>
<script src="js/preview-app.js?v=1"></script>
<script src="dash/js/chat-dash.js?v=1"></script>
<script src="dash/js/mlog.js?v=1" defer></script>
<script src="dash/js/hud.js?v=1" defer></script>
<script src="dash/js/talk.js?v=1" defer></script>
<script src="dash/js/interludes.js?v=1" defer></script>
<script src="dash/js/ad-plane.js?v=2" defer></script>
<script src="dash/js/sticky-head.js?v=1" defer></script>
<script src="dash/js/bonnie-sound.js?v=1" data-page="dash" defer></script>
<script src="dash/js/tide-swell.js?v=1" defer></script>
</body>
</html>
