<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F8CFDB">
<title>Chat with Simmie</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Gochi+Hand&family=Kaushan+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dad-palette.css?v=1">
<link rel="stylesheet" href="css/chat.css?v=5">
<link rel="stylesheet" href="css/chat-dashlayout.css?v=1">
</head>
<body>
<!-- static background (texture only, chat page colours; nothing moves): css/chat-dashlayout.css -->
<div class="chat-bg" aria-hidden="true"><div class="chat-bg-dots"></div><div class="chat-bg-code"></div></div>
<main id="app">

  <section id="screen-loading" class="screen card center">
    <p class="hand">Loading…</p>
  </section>

  <section id="screen-notready" class="screen card center" hidden>
    <h1 class="logo">Chat with <span>Simmie</span></h1>
    <p class="big">This chat isn't set up yet.</p>
    <p class="muted">Check back soon. It'll be ready once the password is set.</p>
  </section>

  <section id="screen-login" class="screen card" hidden>
    <h1 class="logo">Chat with <span>Simmie</span></h1>
    <p class="muted">Type the password to open your private chat.</p>
    <form id="login-form" autocomplete="off">
      <label for="pw" class="hand">Password</label>
      <div class="pw-row">
        <input id="pw" type="password" autocomplete="off" required autocapitalize="none" autocorrect="off" spellcheck="false">
        <button type="button" id="pw-toggle" class="ghost" aria-label="Show password">Show</button>
      </div>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-btn" class="btn" type="submit">Open chat</button>
    </form>
  </section>

  <section id="screen-chat" class="screen chat" hidden>
    <!-- header: same structure as Bonnie's Dashboard (top bar with logo left + keys right, info row, tagline on its own line
         under the header); chat page colours unchanged (Danny 24 Oct 2026 02:48 AWST). css/chat-dashlayout.css -->
    <header class="chat-head dash-head" id="chat-head">
      <div class="topbar"><div class="container">
        <div class="who">
          <div class="avatar" aria-hidden="true">S</div>
          <div class="name">Simmie</div>
        </div>
        <span class="tb-right"><button id="lock-btn" class="ghost lockbtn" type="button" title="Lock this chat">🔒 Lock</button></span>
      </div></div>
      <!-- bottom row of the header, where the dashboard's mark row sits: the tagline. Danny 24 Oct 2026 02:59 AWST: tagline in the
           header's bottom row, not on its own line below. Text = the chat page's existing sub-line (it has no separate tagline). -->
      <div class="masthead"><div class="container"><div id="status" class="status">Replies usually take under a minute</div></div></div>
    </header>
    <div id="log" class="log" aria-live="polite" aria-label="Messages"></div>
    <!-- footer: locked to the bottom like the dashboard's (status line just above the bar, bar = the message box taking the
         remaining width + Send); safe-area aware; the log scrolls between header and footer, so nothing hides behind it. -->
    <div id="chat-foot" class="chat-foot">
      <div id="typing" class="typing" hidden><span class="dots"><i></i><i></i><i></i></span> <span id="typing-text">Waiting for Simmie…</span></div>
      <footer class="footer" id="app-foot"><div class="container"><span>Messages are encrypted and sent securely to Simmie</span></div></footer>
      <form id="send-form" class="composer" autocomplete="off"><div class="container">
        <textarea id="msg" rows="1" maxlength="1500" placeholder="Type a message…" aria-label="Message"></textarea>
        <button id="send-btn" class="send" type="submit" aria-label="Send">➤</button>
      </div></form>
    </div>
  </section>

</main>
<script src="js/crypto.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
